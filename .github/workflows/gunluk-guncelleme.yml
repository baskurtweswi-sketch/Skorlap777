name: Günlük bülten güncellemesi

on:
  schedule:
    - cron: '0 3 * * *'    # 06:00 İstanbul
    - cron: '0 15 * * *'   # 18:00 İstanbul
  workflow_dispatch:        # elle tetikleme

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bülteni kaynaktan derle
        run: node tools/build-static.js

      - name: Değişiklikleri yayınla
        run: |
          git config user.name "SkorLab Bot"
          git config user.email "bot@skorlab.local"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, yayınlanmadı"
          else
            git commit -m "Günlük bülten güncellendi ($(date +%F))"
            git push
          fi
